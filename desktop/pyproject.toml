[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "movo"
version = "1.1.0"
description = "Control your computer with hand and head gestures — privately, on-device."
readme = "../README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Momen Ibrahim Fawzy Hassan", email = "momenibrahimfawzy982000@gmail.com" }]
dependencies = [
    "mediapipe>=0.10.14",
    "numpy>=1.24",
    "PySide6>=6.6",
    "pynput>=1.7.7",
    "websockets>=13",
    "segno>=1.6",
    "pycaw>=20240316; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6.6", "pillow>=10"]
mac = ["pyobjc-framework-Cocoa>=10"]

[project.scripts]
movo = "movo.app:main"

[tool.setuptools.packages.find]
include = ["movo*"]

[tool.setuptools.package-data]
movo = ["i18n/*.json", "assets/icons/*", "assets/sounds/*", "assets/models/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008", "UP007", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017"]

[tool.ruff.lint.isort]
known-first-party = ["movo"]
