name: Movo
options:
  bundleIdPrefix: app.movo
  deploymentTarget:
    iOS: "16.0"
  developmentLanguage: en
  knownRegions: [en, ar]
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Movo:
    type: application
    platform: iOS
    sources:
      - path: Movo
    info:
      path: Supporting/Info.plist
      properties:
        CFBundleDisplayName: Movo
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Movo looks at your hand and head gestures. The picture is processed on this device only and is never saved or sent.
        NSLocalNetworkUsageDescription: Movo can send gesture names (never video) to the Movo app on your own computer.
        CFBundleURLTypes:
          - CFBundleURLName: app.movo.pair
            CFBundleURLSchemes: [movo]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.movo.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
  MovoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MovoTests
    dependencies:
      - target: Movo
schemes:
  Movo:
    build:
      targets:
        Movo: all
        MovoTests: [test]
    test:
      targets: [MovoTests]
