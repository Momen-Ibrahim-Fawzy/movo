name: Mobile

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/mobile.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["mobile/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unit tests and debug APK
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Movo-Android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: movo-android
          path: mobile/android/Movo-Android.apk
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/android/Movo-Android.apk

  ios:
    name: iOS (simulator build + tests)
    # macOS minutes are expensive on private repos: run on tags or on demand.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Build and test
        run: |
          xcodebuild test -project Movo.xcodeproj -scheme Movo \
            -destination "platform=iOS Simulator,name=$(xcrun simctl list devices available | grep -m1 -o 'iPhone [0-9][0-9]*[^()]*' | sed 's/ *$//')" \
            CODE_SIGNING_ALLOWED=NO | tail -50
          exit ${PIPESTATUS[0]}
