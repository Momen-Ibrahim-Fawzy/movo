<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      :root { --bg: #ffffff; --text: #1f1f1f; --muted: #5f6368; --ok: #1e8e3e; --bad: #d93025; --border: #e0e3e7; --accent: #1a73e8; }
      @media (prefers-color-scheme: dark) {
        :root { --bg: #28292c; --text: #e8eaed; --muted: #9aa0a6; --border: #3c4043; --ok: #81c995; --bad: #f28b82; --accent: #8ab4f8; }
      }
      body { margin: 0; width: 280px; font: 13px/1.45 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
      header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
      header img { width: 28px; height: 28px; }
      h1 { font-size: 15px; margin: 0; }
      main { padding: 14px 16px; }
      .status { display: flex; align-items: center; gap: 8px; font-weight: 600; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--bad); }
      .ok .dot { background: var(--ok); }
      p { color: var(--muted); margin: 10px 0 0; }
      label { display: block; margin-top: 12px; color: var(--muted); }
      input { width: 90px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 7px; background: transparent; color: var(--text); }
      input:focus { outline: 1px solid var(--accent); }
    </style>
  </head>
  <body>
    <header><img src="icons/64.png" alt="" /><h1 id="title"></h1></header>
    <main>
      <div class="status" id="status"><span class="dot"></span><span id="statusText"></span></div>
      <p id="hint"></p>
      <label><span id="portLabel"></span> <input id="port" type="number" min="1024" max="65535" /></label>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
